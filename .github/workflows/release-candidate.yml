# Release candidate: every check that decides a merge AND a deploy, run on
# the exact commit (sandmill-infra/ip-approval/PLAN.md). The public staging
# mirror (vthunder/mingo-staging) runs it on every push, and
# sandmill-infra/bin/ip-submit.sh refuses a commit unless all of these jobs
# passed there. The canonical repo runs the identical workflow on every pull
# request to main, and branch protection requires every job. No path
# filters: a job that does not run is a failure, never a pass by absence.
#
# Jobs: the workspace tests under the pinned toolchain (with no network but
# loopback, so no test can lean on DNS, a chain RPC or a third-party API),
# the supply-chain audit, and every image the deploy workflows build, built
# the same way and then started with a throwaway config and probed.
name: release-candidate
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rc / rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Exactly the rustc both Dockerfiles' pinned image carries; checked below.
      - uses: dtolnay/rust-toolchain@633c1125191e55c620c8ae7d364073c0ead621c1 # 1.93.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: toolchain is exactly the one both Dockerfiles' pinned image carries; sbo pins agree
        run: |
          set -euo pipefail
          a="$(sed -nE 's/^FROM (rust:[^ ]+) AS chef.*/\1/p' deploy/mingo/Dockerfile | head -1)"
          b="$(sed -nE 's/^FROM (rust:[^ ]+) AS chef.*/\1/p' deploy/sbo-daemon/Dockerfile | head -1)"
          [ -n "$a" ] && [ "$a" = "$b" ] || { echo "::error::Dockerfiles disagree on the rust image (mingo $a, sbo-daemon $b)"; exit 1; }
          tag="$(sed -nE 's/^rust:([0-9.]+)-.*/\1/p' <<<"$a")"
          img="$(docker buildx imagetools inspect "$a" --format '{{json .Image}}' | jq -r '."linux/amd64".config.Env[]? // .config.Env[]?' | sed -n 's/^RUST_VERSION=//p')"
          have="$(rustc --version | awk '{print $2}')"
          echo "Dockerfile tag $tag, image carries $img, this job runs $have"
          [ "$tag" = "$img" ] && [ "$img" = "$have" ] || { echo "::error::toolchain mismatch: tag $tag, image $img, CI $have"; exit 1; }
          # deploy/sbo-daemon/Dockerfile says to keep SBO_REV in sync with the
          # sbo-core git pin in Cargo.toml.
          core="$(sed -nE 's/^sbo-core = .*rev = "([0-9a-f]+)".*/\1/p' Cargo.toml)"
          revs="$(sed -nE 's/^ARG SBO_REV=([0-9a-f]+)/\1/p' deploy/sbo-daemon/Dockerfile | sort -u)"
          [ -n "$core" ] && [ "$revs" = "$core" ] || { echo "::error::SBO_REV ($revs) in deploy/sbo-daemon/Dockerfile differs from the sbo-core rev ($core) in Cargo.toml"; exit 1; }
          echo "sbo $core"
      - name: build the tests (network allowed for the crate fetch)
        run: cargo test --workspace --locked --no-run
      # The test binaries then run in a fresh network namespace with only
      # loopback up: a test that needs public DNS, a live chain RPC or a
      # third-party API fails here every time instead of 1 run in N.
      - name: workspace tests, offline (loopback only)
        run: |
          # -E keeps the job's environment (cargo/rustup homes, the flags
          # rust-cache sets) so the binaries built above are reused as-is.
          sudo -E env "PATH=$PATH" unshare --net -- sh -c 'ip link set lo up && exec setpriv --reuid="$SUDO_UID" --regid="$SUDO_GID" --init-groups -- cargo test --workspace --locked --offline'

  audit:
    name: rc / audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans every commit
      - uses: dtolnay/rust-toolchain@633c1125191e55c620c8ae7d364073c0ead621c1 # 1.93.1
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-audit
      - run: scripts/supply-chain-audit.sh rust
      # The CLI over HEAD's full history, not gitleaks-action: the action
      # scans only the pushed or PR commit range, so the mirror could pass
      # what the canonical PR fails. Default rules (no .gitleaks.toml: no
      # allowlisted fixtures in this repo). Checksummed release binary.
      - name: gitleaks (full history of HEAD)
        run: |
          v=8.30.1; sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          echo "$sum  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --no-banner

  # Every image a deploy workflow builds, built the way it builds it (same
  # action, file, context, platform; no build args in either), loaded
  # instead of pushed. Then each is started with a throwaway config and NO
  # network (`--network none`), and its health endpoints are probed from
  # inside its own network namespace. A dependency needing a newer compiler,
  # a missing COPY, or a startup refusal fails here instead of at deploy.
  image:
    name: rc / image ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # deploy-mingo.yml. mingo-idp has no dedicated health route; the
          # discovery document, the SPA index and a static IdP page together
          # prove the binary, the SPA layer and the static layer.
          - app: mingo
            file: deploy/mingo/Dockerfile
            port: 5000
            probes: "/.well-known/browserid / /device-authorize"
            env: "-e MINGO_IDP_DB=/tmp/rc/idp.sqlite -e MINGO_IDP_KEY_FILE=/tmp/rc/idp-key.json -e MINGO_POSTER_KEY_FILE=/tmp/rc/poster-key.json -e MINGO_ADMIN_TOKEN=rc-throwaway"
          # deploy-daemon.yml. Throwaway checkpoint and attestor keys, so the
          # entrypoint's key-file path runs as it does in production.
          - app: sbo-daemon
            file: deploy/sbo-daemon/Dockerfile
            port: 5000
            probes: "/health"
            env: "-e SBO_CHECKPOINT_KEY=GEN -e SBO_ATTEST_KEY=GEN"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: build (as the deploy workflow does, loaded instead of pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          load: true
          tags: rc-${{ matrix.app }}
          # Read the deploy workflow's cache (default scope) and this job's
          # own; write only this job's, so a branch run never overwrites the
          # cache the deploy relies on.
          cache-from: |
            type=gha
            type=gha,scope=rc-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=rc-${{ matrix.app }}
      - name: start offline and probe
        env:
          APP_ENV: ${{ matrix.env }}
          PORT: ${{ matrix.port }}
          PROBES: ${{ matrix.probes }}
        run: |
          set -uo pipefail
          envargs="${APP_ENV//=GEN/=$(openssl rand -hex 32)}"
          # shellcheck disable=SC2086
          docker run -d --name rc --network none $envargs rc-${{ matrix.app }}
          pid="$(docker inspect -f '{{.State.Pid}}' rc)"
          probe() { sudo nsenter -t "$pid" -n curl -sf -o /dev/null "http://127.0.0.1:${PORT}$1"; }
          first="${PROBES%% *}"; up=0
          for i in $(seq 1 60); do
            probe "$first" && { echo "$first answered after ${i}s"; up=1; break; }
            [ "$(docker inspect -f '{{.State.Running}}' rc)" = true ] || break
            sleep 1
          done
          [ "$up" = 1 ] || { echo "::error::${{ matrix.app }} image did not answer $first"; docker logs rc 2>&1 | tail -60; exit 1; }
          for p in $PROBES; do
            probe "$p" || { echo "::error::${{ matrix.app }}: $p did not answer 200"; docker logs rc 2>&1 | tail -60; exit 1; }
            echo "ok $p"
          done
          # Still up a few seconds later: catches a crash after the bind.
          sleep 5
          [ "$(docker inspect -f '{{.State.Running}}' rc)" = true ] && probe "$first" || { echo "::error::${{ matrix.app }} exited after starting"; docker logs rc 2>&1 | tail -60; exit 1; }
          docker logs rc 2>&1 | tail -20
          docker rm -f rc >/dev/null
