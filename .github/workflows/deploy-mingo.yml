# Build mingo (mingo-idp + SPA) in CI and deploy the IMAGE to dokku — same
# pattern as deploy-daemon.yml. The sandmill.org host (24G disk) can't keep a
# warm Rust cache, so on-host `git push dokku` cold-compiled the workspace
# (~40 min); here GitHub Actions compiles with a persistent type=gha layer
# cache and dokku just PULLS the ~100MB runtime image.
#
# One-time setup (done 2026-08-11, bean browserid-ng-5l83):
#   dokku builder:set mingo selected dockerfile
#   dokku builder-dockerfile:set mingo dockerfile-path     # cleared: from-image
#                                                          # generates its own
# The GHCR package inherits the repo's public visibility (validated on
# sbo-daemon) — no manual step. An SPA-only change rebuilds in ~1 min (the
# cargo layers all hit cache; the SPA is the last runtime layer).
name: Deploy mingo

on:
  push:
    branches: [main]
    paths:
      - "mingo-idp/**"
      - "mingo-web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deploy/mingo/**"
      - ".github/workflows/deploy-mingo.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-mingo
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mingo

jobs:
  build-and-deploy:
    # Only the canonical repo deploys; the public staging mirror
    # (vthunder/mingo-staging) carries this file but must never release.
    if: github.repository == 'vthunder/mingo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/mingo/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to dokku (pull + run the image)
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/id_deploy <<< "${{ secrets.DOKKU_SSH_KEY }}"
          ssh-keyscan -H sandmill.org >> ~/.ssh/known_hosts 2>/dev/null
          # `git:from-image` exits 1 on an unchanged image digest — a re-run of an
          # already-released sha is a no-op, not a failure.
          out=$(ssh -i ~/.ssh/id_deploy dokku@sandmill.org \
            git:from-image mingo "${IMAGE}:${{ github.sha }}" 2>&1) \
            || { echo "$out" | grep -q "No changes detected" \
                 && echo "no-op: image digest unchanged (already deployed)" \
                 || { echo "$out" | tail -30; exit 1; }; }
          echo "$out" | tail -5
